  <script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) {
      showSlides(slideIndex += n);
    }

    function showSlides(n) {
      let slides = document.getElementsByClassName("mySlides1");
      if (n > slides.length) { slideIndex = 1; }
      if (n < 1) { slideIndex = slides.length; }

      let current = slideIndex - 1;
      let prev = (current - 1 + slides.length) % slides.length;
      let next = (current + 1) % slides.length;

      for (let i = 0; i < slides.length; i++) {
        slides[i].classList.remove("active", "prev", "next", "hidden");
        slides[i].style.display = "block";

        if (i === current) {
          slides[i].classList.add("active");
        } else if (i === prev) {
          slides[i].classList.add("prev");
        } else if (i === next) {
          slides[i].classList.add("next");
        } else {
          slides[i].classList.add("hidden");
        }
      }
    }

    let touchStartX = 0;
    let touchEndX = 0;

    const slideshow = document.querySelector(".slideshow-container");

    slideshow.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    slideshow.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const delta = touchEndX - touchStartX;
      const minDistance = 50; // Mindest-Wischdistanz in px
      if (Math.abs(delta) < minDistance) return; // Tap ignorieren
      if (delta < 0) {
        plusSlides(1);   // nach links gewischt → nächste
      } else {
        plusSlides(-1);  // nach rechts gewischt → vorherige
      }
    }

  </script>
